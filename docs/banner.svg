<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Motion Studio — 20 open-source repos, one motion pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="100%" stop-color="#0b1219" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#57a9ff" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#8b6cff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#070a0e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cc4ff" />
      <stop offset="55%" stop-color="#57a9ff" />
      <stop offset="100%" stop-color="#8b6cff" />
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57a9ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#57a9ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b6cff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" />
  <rect width="1200" height="300" fill="url(#glow)" />
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1b2836" stroke-width="1" />

  <g transform="translate(600 128)">
    <rect x="-286" y="-52"  width="12" height="52"  rx="4" fill="url(#bar)" opacity="0.55" />
    <rect x="-262" y="-74"  width="12" height="74"  rx="4" fill="url(#bar)" opacity="0.65" />
    <rect x="-238" y="-96"  width="12" height="96"  rx="4" fill="url(#bar)" opacity="0.75" />
    <rect x="-214" y="-64"  width="12" height="64"  rx="4" fill="url(#bar)" opacity="0.6" />
    <rect x="-190" y="-118" width="12" height="118" rx="4" fill="url(#bar)" opacity="0.9" />
    <rect x="-166" y="-88"  width="12" height="88"  rx="4" fill="url(#bar)" opacity="0.7" />
    <rect x="-142" y="-140" width="12" height="140" rx="4" fill="url(#bar)" />
    <rect x="-118" y="-60"  width="12" height="60"  rx="4" fill="url(#bar)" opacity="0.6" />
    <rect x="-94"  y="-108" width="12" height="108" rx="4" fill="url(#bar)" opacity="0.85" />
    <rect x="-70"  y="-32"  width="12" height="32"  rx="4" fill="url(#bar)" opacity="0.45" />
    <rect x="-46"  y="-72"  width="12" height="72"  rx="4" fill="url(#bar)" opacity="0.65" />
    <rect x="-22"  y="-124" width="12" height="124" rx="4" fill="url(#bar)" opacity="0.9" />
    <rect x="2"    y="-46"  width="12" height="46"  rx="4" fill="url(#bar)" opacity="0.55" />
    <rect x="26"   y="-92"  width="12" height="92"  rx="4" fill="url(#bar)" opacity="0.75" />
    <rect x="50"   y="-136" width="12" height="136" rx="4" fill="url(#bar)" />
    <rect x="74"   y="-58"  width="12" height="58"  rx="4" fill="url(#bar)" opacity="0.6" />
    <rect x="98"   y="-102" width="12" height="102" rx="4" fill="url(#bar)" opacity="0.8" />
    <rect x="122"  y="-30"  width="12" height="30"  rx="4" fill="url(#bar)" opacity="0.4" />
    <rect x="146"  y="-66"  width="12" height="66"  rx="4" fill="url(#bar)" opacity="0.6" />
    <rect x="170"  y="-24"  width="12" height="24"  rx="4" fill="url(#bar)" opacity="0.35" />
