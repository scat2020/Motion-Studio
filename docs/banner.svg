  <text x="600" y="196" text-anchor="middle" font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="6" fill="#e9f0f8">MOTION STUDIO</text>
  <rect x="360" y="216" width="480" height="1.5" fill="url(#rule)" />
  <text x="600" y="252" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="4" fill="#8c99a8">20 OPEN-SOURCE REPOS · ONE STAGE · 12 LIVE DEMOS</text>
